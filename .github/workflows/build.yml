name: Build Bad Apple ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          libncurses5-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          fakeroot \
          dwarves \
          grub-pc-bin \
          grub-common \
          grub-efi-amd64-bin \
          xorriso \
          cpio \
          bc \
          gcc-multilib \
          pkg-config \
          mtools

      - name: Build kernel
        run: make -j$(nproc)
      
      - name: Build ISO
        run: |
          chmod +x ./build_iso.sh
          ./build_iso.sh
      
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: BadAppleLinux-ISO
          path: /tmp/BadAppleLinux.iso
